name: Build & push image

# Image dibangun di GitHub Actions, lalu Dokploy tinggal menariknya. Mesin server
# tidak perlu ikut membangun, sehingga deploy jauh lebih ringan dan cepat.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Uji dijalankan lebih dulu dan menjadi syarat build. Tanpa ini, image yang
  # rusak tetap terdorong ke registry dan baru ketahuan setelah dipasang.
  uji:
    name: Lint & uji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Uji otomatis
        run: npm test

  image:
    name: Build & push
    runs-on: ubuntu-latest
    needs: uji

    permissions:
      contents: read
      # Dibutuhkan untuk mendorong image ke GitHub Container Registry memakai
      # GITHUB_TOKEN bawaan, tanpa perlu menyimpan kata sandi registry.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Nama image di GHCR wajib huruf kecil, sedangkan nama repositori boleh
      # mengandung huruf besar.
      - name: Susun nama image
        id: nama
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tentukan tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nama.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache disimpan di GitHub Actions supaya lapisan npm ci tidak dibangun
          # ulang setiap kali kode berubah.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ringkasan
        run: |
          {
            echo "### Image siap ditarik"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
