name: Build & push image

# Image dibangun di GitHub Actions, lalu Dokploy tinggal menariknya lewat
# docker-compose.yml. Mesin server tidak perlu ikut membangun, sehingga deploy
# jauh lebih ringan dan cepat.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Push yang datang beruntun tidak perlu dibangun semuanya: hanya yang terakhir
# yang akan dipakai. Yang lebih lama dibatalkan supaya antrean tidak menumpuk.
# Tag rilis dikecualikan lewat penamaan grup per ref.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  # Uji dijalankan lebih dulu dan menjadi syarat build. Tanpa ini, image yang
  # rusak tetap terdorong ke registry dan baru ketahuan setelah dipasang.
  uji:
    name: Lint & uji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      # Kesalahan tipe menggagalkan `next build` di dalam Docker, dan kegagalan di
      # sana muncul sebagai galat build image yang jauh lebih sulit dibaca.
      # Diperiksa lebih dulu di sini supaya pesannya langsung menunjuk berkasnya.
      - name: Periksa tipe
        run: npx tsc --noEmit

      - name: Uji otomatis
        run: npm test

      # Salah tulis di compose baru ketahuan saat deploy gagal di server, padahal
      # bisa ditangkap di sini dalam hitungan detik. Nilai di bawah hanya boneka
      # agar variabel wajib terpenuhi; yang sebenarnya diisi di Dokploy.
      - name: Periksa docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
        env:
          DATABASE_URL: postgresql://periksa:periksa@localhost:5432/periksa
          SESSION_SECRET: periksa-periksa-periksa-periksa-periksa

  image:
    name: Build & push
    runs-on: ubuntu-latest
    needs: uji

    permissions:
      contents: read
      # Dibutuhkan untuk mendorong image ke GitHub Container Registry memakai
      # GITHUB_TOKEN bawaan, tanpa perlu menyimpan kata sandi registry.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Nama image di GHCR wajib huruf kecil, sedangkan nama repositori boleh
      # mengandung huruf besar.
      - name: Susun nama image
        id: nama
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tentukan tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nama.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache disimpan di GitHub Actions supaya lapisan npm ci tidak dibangun
          # ulang setiap kali kode berubah.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ringkasan
        run: |
          {
            echo "### Image siap ditarik"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Dipakai oleh \`docker-compose.yml\` lewat tag \`latest\`."
            echo "Untuk mundur ke versi ini, setel \`APP_IMAGE\` di Dokploy ke salah satu tag di atas."
          } >> "$GITHUB_STEP_SUMMARY"

  # Dokploy menarik image sendiri, tapi hanya kalau diberi tahu. Tanpa langkah
  # ini deploy tetap jalan — cukup tekan Redeploy di Dokploy secara manual.
  # Dengan secret DOKPLOY_WEBHOOK_URL terisi, push ke main langsung tayang.
  deploy:
    name: Picu redeploy Dokploy
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main'

    env:
      WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}

    steps:
      - name: Beri tahu Dokploy
        # Secret tidak bisa dibaca langsung di `if`, jadi dilewatkan dulu lewat
        # env. Kalau belum diisi, langkah ini dilewati tanpa menggagalkan alur.
        if: env.WEBHOOK != ''
        run: curl --fail --silent --show-error --location -X POST "$WEBHOOK"

      - name: Ingatkan kalau webhook belum disetel
        if: env.WEBHOOK == ''
        run: |
          {
            echo "### Redeploy masih manual"
            echo
            echo "Secret \`DOKPLOY_WEBHOOK_URL\` belum diisi, jadi image baru sudah"
            echo "siap di GHCR tapi belum dipasang. Tekan **Redeploy** di Dokploy,"
            echo "atau salin Webhook URL dari Dokploy ke secret tersebut supaya"
            echo "langkah ini mengerjakannya sendiri."
          } >> "$GITHUB_STEP_SUMMARY"
